<link rel="apple-touch-icon" href="/static/img/ajeer-mark.png">
<meta name="theme-color" content="#05184D">
<link rel="manifest" href="/site.webmanifest">
<meta property="og:site_name" content="أجير">
<meta property="og:title" content="أجير">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أجير</title>
<style>
@font-face{
  font-family:'NotoKufi';
  src:url('{{ assets }}fonts/NotoKufi-Regular.woff2') format('woff2');
  font-weight:400;font-style:normal;font-display:block;
}
@page{ size:{{ doc.w }}pt {{ doc.h }}pt; margin:0 }
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eef1f6}
body{font-family:'NotoKufi',sans-serif}

.sheet{
  position:relative;
  width:{{ doc.w }}pt;height:{{ doc.h }}pt;
  margin:0 auto;background:#fff;
  box-shadow:0 10px 34px rgba(20,35,63,.18);
}
.sheet svg{display:block;width:100%;height:100%}
.sheet text{font-family:'NotoKufi',sans-serif;white-space:pre}

/* شريط أدوات الشاشة */
.bar{
  position:sticky;top:0;z-index:9;
  display:flex;gap:8px;align-items:center;
  background:#0b2545;color:#fff;padding:10px 18px;
  font:600 13px/1.2 'NotoKufi',sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.18);
}
.bar .ttl{font-size:13px;opacity:.85;margin-inline-end:auto}
.bar a,.bar button{
  all:unset;cursor:pointer;background:#13a09a;color:#fff;
  padding:8px 14px;border-radius:9px;font:600 13px/1 'NotoKufi',sans-serif;
}
.bar a:hover,.bar button:hover{filter:brightness(1.06)}
.bar .ghost{background:rgba(255,255,255,.14)}
.sheet-wrap{padding:22px 12px 40px;display:flex;justify-content:center;align-items:flex-start}
body.embed{background:#eef1f6;overflow:hidden}
body.embed .sheet-wrap{padding:0;min-height:100vh;align-items:center}
body.embed .sheet{box-shadow:0 4px 18px rgba(20,35,63,.10);margin:0}

@media print{
  html,body{background:#fff;width:{{ doc.w }}pt;height:{{ doc.h }}pt}
  .sheet{box-shadow:none!important;zoom:1!important;margin:0!important}
  .sheet-wrap{display:block!important;padding:0!important;min-height:0!important}
  .bar{display:none!important}
}
</style>
</head>
<body class="{{ mode }}">

{% if mode != 'embed' %}
<div class="bar">
  <span class="ttl">تصريح أجير — {{ c.permit_no }}</span>
  <button type="button" onclick="window.print()">طباعة</button>
  <a class="ghost" href="{{ pdf_url }}">تنزيل PDF</a>
  <a class="ghost" href="{{ back_url }}">رجوع</a>
</div>
{% endif %}

<div class="sheet-wrap">
<div class="sheet" id="sheet">
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 {{ doc.w }} {{ doc.h }}" width="{{ doc.w }}" height="{{ doc.h }}"
     preserveAspectRatio="none" shape-rendering="geometricPrecision"
     text-rendering="geometricPrecision">
{%- for it in doc['items'] %}
{%- if it.t == 'rect' %}
  <rect x="{{ it.x }}" y="{{ it.y }}" width="{{ it.w }}" height="{{ it.h }}"
        {%- if it.fill %} fill="{{ it.fill }}"{% else %} fill="none"{% endif %}
        {%- if it.stroke %} stroke="{{ it.stroke }}" stroke-width="{{ it.lw }}"{% endif %}/>
{%- elif it.t == 'ellipse' %}
  <ellipse cx="{{ '%.3f'|format(it.x + it.w/2) }}" cy="{{ '%.3f'|format(it.y + it.h/2) }}"
           rx="{{ '%.3f'|format(it.w/2) }}" ry="{{ '%.3f'|format(it.h/2) }}" fill="{{ it.fill }}"/>
{%- elif it.t == 'img' %}
  <image x="{{ it.x }}" y="{{ it.y }}" width="{{ it.w }}" height="{{ it.h }}"
         preserveAspectRatio="none"
         href="{% if it.src == 'qr' %}{{ c.qr }}{% else %}{{ assets }}{{ it.src }}{% endif %}"/>
{%- elif it.t == 'text' %}
  {%- if it.href %}<a href="{{ it.href }}" target="_blank" rel="noopener">{% endif %}
  <text x="{{ '%.3f'|format(it.pen + it.adv if it.dir == 'rtl' else it.pen) }}"
        y="{{ it.y }}" font-size="{{ it.size }}" fill="{{ it.color }}"
        direction="{{ it.dir }}" text-anchor="start" xml:space="preserve"
        text-rendering="geometricPrecision"
        {%- if it.bold %} paint-order="stroke" stroke="{{ it.color }}"
        stroke-width="{{ '%.3f'|format(it.size/30) }}" stroke-linejoin="round"{% endif %}>{{ it.s }}</text>
  {%- if it.href %}</a>{% endif %}
{%- endif %}
{%- endfor %}
</svg>
</div>
</div>

<script>
(function () {
  var sheet = document.getElementById('sheet');
  if (!sheet) return;
  var W = {{ doc.w }}, H = {{ doc.h }}, K = 96 / 72;   /* pt → css px */
  var EMBED = {{ 'true' if mode == 'embed' else 'false' }};
  function fit() {
    var vw = document.documentElement.clientWidth;
    var vh = document.documentElement.clientHeight;
    var sw = (vw - (EMBED ? 0 : 32)) / (W * K);
    var k = EMBED ? Math.min(sw, (vh - 8) / (H * K)) : Math.min(1, sw);
    k = Math.max(0.08, Math.min(k, 1));
    sheet.style.zoom = k.toFixed(4);
  }
  window.addEventListener('resize', fit);
  window.addEventListener('beforeprint', function () { sheet.style.zoom = 1; });
  window.addEventListener('afterprint', fit);
  document.addEventListener('DOMContentLoaded', fit);
  fit();
  {% if mode == 'print' and auto_print %}
  window.addEventListener('load', function () { setTimeout(function () { window.print(); }, 450); });
  {% endif %}
})();
</script>
</body>
</html>
